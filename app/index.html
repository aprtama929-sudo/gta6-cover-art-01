<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Pop — GTA-style cover maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">PANEL<span>POP</span></div>
  <p class="tagline">Turn a photo and a caption into multi-panel, GTA-style cover art. Fully offline — your photos never leave this machine.</p>
</header>
<main class="workspace">
  <section class="stage-wrap">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <p class="hint">Click a panel to select it. Drag to reposition its photo, scroll to zoom.</p>
  </section>
  <aside class="controls">
    <div class="group">
      <h2>Photo for <span id="selLabel">Panel 1</span></h2>
      <div class="row">
        <button type="button" id="usePier">Pier sample</button>
        <button type="button" id="useBoulevard">Boulevard sample</button>
      </div>
      <div class="row">
        <button type="button" id="uploadBtn">Upload photo…</button>
        <button type="button" id="clearPanel">Clear panel</button>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <button type="button" id="spreadBtn" class="wide">Spread this photo across every panel</button>
      <label>Zoom <input type="range" id="zoom" min="1" max="3.5" step="0.01" value="1"></label>
      <label>Shift across <input type="range" id="sx" min="-0.6" max="0.6" step="0.005" value="0"></label>
      <label>Shift up / down <input type="range" id="sy" min="-0.6" max="0.6" step="0.005" value="0"></label>
    </div>
    <div class="group">
      <h2>Layout</h2>
      <div class="row wrap" id="layouts"></div>
    </div>
    <div class="group">
      <h2>Colour grade</h2>
      <select id="grade"></select>
      <label>Brightness <input type="range" id="bright" min="0.5" max="1.5" step="0.01" value="1"></label>
      <label>Contrast <input type="range" id="con" min="0.5" max="1.6" step="0.01" value="1"></label>
      <label>Saturation <input type="range" id="sat" min="0" max="2" step="0.01" value="1"></label>
    </div>
    <div class="group">
      <h2>Lettering</h2>
      <label>Title <input type="text" id="title" maxlength="40" value="PANEL POP"></label>
      <label>Subtitle <input type="text" id="subtitle" maxlength="60" value="Welcome to Leonida"></label>
      <label>Title fill
        <select id="titleFill">
          <option value="white">White</option>
          <option value="sunset" selected>Sunset gradient</option>
          <option value="neon">Neon gradient</option>
          <option value="gold">Gold gradient</option>
        </select>
      </label>
      <label>Title size <input type="range" id="titleSize" min="0.5" max="1.4" step="0.02" value="1"></label>
      <label class="check"><input type="checkbox" id="badgeOn" checked> Corner badge</label>
      <label>Badge text <input type="text" id="badgeText" maxlength="4" value="VI"></label>
    </div>
    <div class="group">
      <h2>Export PNG</h2>
      <div class="row wrap">
        <button type="button" class="export-btn" data-w="1080" data-h="1080">1080 × 1080</button>
        <button type="button" class="export-btn" data-w="1080" data-h="1350">1080 × 1350</button>
        <button type="button" class="export-btn" data-w="1920" data-h="1080">1920 × 1080</button>
        <button type="button" class="export-btn" data-w="1080" data-h="1920">1080 × 1920</button>
      </div>
      <div class="row">
        <button type="button" id="undoBtn">Undo</button>
        <button type="button" id="redoBtn">Redo</button>
        <button type="button" id="resetBtn">Reset panels</button>
      </div>
    </div>
  </aside>
</main>
<script type="module" src="src/editor.js"></script>
</body>
</html>
